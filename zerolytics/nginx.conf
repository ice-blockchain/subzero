server {
	listen 80 default_server;
	listen [::]:80 default_server;

	auth_basic "Restricted Access";
	auth_basic_user_file /etc/nginx/.htpasswd;

	server_name _;

	location / {
		include uwsgi_params;
		uwsgi_pass 127.0.0.1:3031;
		uwsgi_buffering off;
		uwsgi_read_timeout 900s;
		client_max_body_size 10M;
	}
}
